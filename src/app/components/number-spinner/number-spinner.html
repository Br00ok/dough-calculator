<div class="flex items-center space-x-2 py-4">
  <button class="btn btn-outline" (click)="decrement()">
    <lucide-icon [img]="minusIcon" class="w-6 h-6"></lucide-icon>
  </button>
  <input
    type="number"
    class="input input-bordered w-fit text-center text-2xl"
    [(ngModel)]="value"
    [min]="min"
    [max]="max"
  />
  <button class="btn btn-outline" (click)="increment()">
    <lucide-icon [img]="plusIcon" class="w-6 h-6"></lucide-icon>
  </button>
</div>
